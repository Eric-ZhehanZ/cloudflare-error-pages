<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Error • ZhehanZ Edge</title>
    <link rel="icon" type="image/png" sizes="72x72" href="https://pages.edge.zheha.nz/favicon.png" />
    <link rel="apple-touch-icon" href="https://pages.edge.zheha.nz/favicon.png" />
    
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f4;
            --fg-strong: #000;
            --fg: rgba(0, 0, 0, 0.5);
            --fg-muted: rgba(0, 0, 0, 0.3);
            --line: rgba(0, 0, 0, 0.15);
            --line-hover: rgba(0, 0, 0, 0.25);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            --content-width: 30rem;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1c1917;
                --fg-strong: #fff;
                --fg: rgba(255, 255, 255, 0.75);
                --fg-muted: rgba(255, 255, 255, 0.3);
                --line: rgba(255, 255, 255, 0.2);
                --line-hover: rgba(255, 255, 255, 0.3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1c1917;
            --fg-strong: #fff;
            --fg: rgba(255, 255, 255, 0.75);
            --fg-muted: rgba(255, 255, 255, 0.3);
            --line: rgba(255, 255, 255, 0.2);
            --line-hover: rgba(255, 255, 255, 0.3);
        }
        :root[data-theme="light"] { color-scheme: light; }

        * { box-sizing: border-box; }
        html {
            background: var(--bg);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }
        .hidden { display: none !important; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 0;
            padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .mark {
            width: 64px;
            height: 64px;
            fill: currentColor;
            color: var(--fg);
            margin-bottom: 1.125rem;
        }
        .large {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .status {
            margin: 0.375rem 0 0;
            max-width: var(--content-width);
            font-size: 1rem;
            line-height: 1.35;
            color: var(--fg);
            text-wrap: balance;
        }

        /* Cloudflare injects the Turnstile widget, then replaces it with its
         * "waiting for <site> to respond" text, inside #captcha-form. Both take
         * the main content width and the page font. */
        .captcha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: calc(var(--content-width) / 2);
            margin: 1.75rem auto 0.25rem;
        }
        /* Flex centering keeps the widget centred even when it is wider than
         * the container: the overflow splits evenly on both sides instead of
         * spilling to the right as inline content would. */
        .captcha-container form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 0;
            text-align: center;
        }
        .captcha-container form,
        .captcha-container form * {
            font-family: var(--font) !important;
            color: var(--fg) !important;
            font-size: 1rem;
            line-height: 1.35;
        }
        .captcha-container form > * {
            flex: none;
            margin-left: auto;
            margin-right: auto;
        }
        .captcha-container form iframe {
            display: block;
            max-width: none;
        }
        /* Once Cloudflare swaps the widget for its "waiting for <site> to
         * respond" text, the form becomes a box of the widget's exact size
         * (300 x 65) so the text sits where the widget was. */
        .captcha-container form.boxed {
            flex: none;
            width: 300px;
            max-width: none;
            height: 65px;
            justify-content: center;
            padding: 0 1rem;
            border: 1px solid var(--line);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .captcha-container form.boxed,
        .captcha-container form.boxed * {
            font-size: 0.9375rem;
            line-height: 1.3;
        }
        .captcha-container form.boxed > * {
            margin: 0 auto;
        }

        footer {
            flex: none;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.25rem calc(1.25rem + env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .more-info {
            display: flex;
            flex-direction: column;
        }
        .footer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
        }
        .protection { margin: 0; white-space: nowrap; }
        .more-info a {
            color: var(--fg-muted);
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 2px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 300ms ease-in-out, text-decoration-color 300ms ease-in-out;
        }
        .more-info a:hover {
            color: var(--fg-strong);
            text-decoration-color: var(--line-hover);
        }
        .info-text {
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
            text-align: left;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 300ms ease, opacity 300ms ease, margin 300ms ease;
        }
        .info-text.open {
            max-height: 16rem;
            opacity: 1;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--line);
        }
        .info-text p { margin: 0; }
        .info-text p + p { margin-top: 0.125rem; }
        .info-text p.meta {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }
        .info-text p.meta + p:not(.meta) { margin-top: 0.5rem; }

        .reveal {
            opacity: 0.001;
            transform: translateY(12px);
            animation: reveal 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes reveal { to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .info-text, .more-info a { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page reveal">
        <svg class="mark" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-100q-78.77 0-148.11-29.96-69.35-29.96-120.66-81.27-51.31-51.31-81.27-120.66Q100-401.23 100-480q0-66.62 20.96-126.04t59.5-108.27L66.62-828.54q-6.7-6.31-6.89-15.92-.19-9.62 6.89-16.31 6.69-7.08 16.11-7.08 9.42 0 16.12 7.08l759.61 759.23q6.69 6.69 6.89 16 .19 9.31-6.89 16-7.07 7.08-16.31 7.08-9.23 0-16.3-7.08L714.31-180.46q-48.85 38.54-108.27 59.5Q546.62-100 480-100Zm-42.23-46.77v-80.85q-34.62 0-58.42-25.23-23.81-25.23-23.81-59.84v-42.85L154-557.08q-4.23 19.23-6.42 38.35-2.19 19.11-2.19 38.73 0 127.69 83.15 222.96 83.15 95.27 209.23 110.27ZM860-480q0 53.54-13.54 102.23-13.54 48.69-38 91-4.85 8.69-13.85 9.81-9 1.11-17.3-4.35-7.7-5.46-9.73-14.38-2.04-8.93 2.8-17.23 21.62-38.62 32.93-80.73 11.3-42.12 11.3-86.35 0-104.08-56.84-189.42-56.85-85.35-152.69-124.19v18.38q0 34.62-23.81 59.85-23.81 25.23-58.42 25.23h-65.08v60.53q0 9.62-9.31 12.93-9.31 3.3-15.54-3.31L295.31-757.23q-13.23-13.62-11.35-31.85 1.89-18.23 18.12-27.46 40.15-20.92 84.73-32.19Q431.39-860 480-860q78.77 0 148.11 29.96 69.35 29.96 120.66 81.27 51.31 51.31 81.27 120.66Q860-558.77 860-480Z"/></svg>
        <h1 class="large" id="main-text"></h1>
        <p class="status" id="status-text"></p>
    </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="protection-text"></p>
                <a id="toggle-info"></a>
            </div>
            <div class="info-text" id="info-text"></div>
        </div>
    </footer>
<script>
    const readCookie = name => {
        try {
            const hit = document.cookie.split('; ').find(c => c.indexOf(name + '=') === 0);
            return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
        } catch (_) {
            return '';
        }
    };
    const cookieLang = readCookie('siteLanguage');
    const lang = cookieLang === 'zh' || cookieLang === 'en' ? cookieLang : (navigator.language.startsWith('zh') ? 'zh' : 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    const appearance = readCookie('siteAppearance');
    if (appearance === 'dark' || appearance === 'light') document.documentElement.dataset.theme = appearance;
    const texts = {
        en: {
            title: "Error • ZhehanZ Edge",
            main: "Region Blocked",
            status: "Your region is blocked from this service",
            show: "Show details",
            hide: "Hide details",
            protection: "ZhehanZ Edge Protection",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: REG",
                "Your connection is fine. The service denied you access based on security rules that disallow users from certain regions or IP ranges."
            ]
        },
        zh: {
            title: "错误 • ZhehanZ Edge",
            main: "地区被阻止",
            status: "您的地区无法访问本服务",
            show: "查看更多信息",
            hide: "隐藏更多信息",
            protection: "ZhehanZ Edge 守护服务",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: REG",
                "您的网络连接正常。基于安全规则，此服务仅限来自特定地区或 IP 范围的用户访问，因此您的请求被拒绝。"
            ]
        }
    };

    function applyDetails(toggle, info, details, showLabel, hideLabel) {
        toggle.textContent = showLabel;
        toggle.setAttribute('role', 'button');
        toggle.setAttribute('tabindex', '0');
        toggle.setAttribute('aria-expanded', 'false');
        const render = () => {
            const isOpen = info.classList.toggle('open');
            toggle.textContent = isOpen ? hideLabel : showLabel;
            toggle.setAttribute('aria-expanded', String(isOpen));
            if (isOpen) {
                info.innerHTML = details.map((line, i) => '<p' + (i < 2 ? ' class="meta"' : '') + '>' + line + '</p>').join('');
            }
        };
        toggle.addEventListener('click', render);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(); } });
    }
    const t = texts[lang];
    document.title = t.title;
    document.getElementById('main-text').textContent = t.main;
    document.getElementById('status-text').textContent = t.status;
    document.getElementById('protection-text').textContent = t.protection;
    applyDetails(
        document.getElementById('toggle-info'),
        document.getElementById('info-text'),
        t.details,
        t.show,
        t.hide
    );
</script>
</body>
</html>
