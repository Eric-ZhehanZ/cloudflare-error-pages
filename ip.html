<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Error • ZhehanZ Edge</title>
    <link rel="icon" type="image/png" sizes="72x72" href="https://pages.edge.zheha.nz/favicon.png" />
    <link rel="apple-touch-icon" href="https://pages.edge.zheha.nz/favicon.png" />
    
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f4;
            --fg-strong: #000;
            --fg: rgba(0, 0, 0, 0.5);
            --fg-muted: rgba(0, 0, 0, 0.3);
            --line: rgba(0, 0, 0, 0.15);
            --line-hover: rgba(0, 0, 0, 0.25);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            --content-width: 30rem;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1c1917;
                --fg-strong: #fff;
                --fg: rgba(255, 255, 255, 0.75);
                --fg-muted: rgba(255, 255, 255, 0.3);
                --line: rgba(255, 255, 255, 0.2);
                --line-hover: rgba(255, 255, 255, 0.3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1c1917;
            --fg-strong: #fff;
            --fg: rgba(255, 255, 255, 0.75);
            --fg-muted: rgba(255, 255, 255, 0.3);
            --line: rgba(255, 255, 255, 0.2);
            --line-hover: rgba(255, 255, 255, 0.3);
        }
        :root[data-theme="light"] { color-scheme: light; }

        * { box-sizing: border-box; }
        html {
            background: var(--bg);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }
        .hidden { display: none !important; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 0;
            padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .mark {
            width: 64px;
            height: 64px;
            fill: currentColor;
            color: var(--fg);
            margin-bottom: 1.125rem;
        }
        .large {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .status {
            margin: 0.375rem 0 0;
            max-width: var(--content-width);
            font-size: 1rem;
            line-height: 1.35;
            color: var(--fg);
            text-wrap: balance;
        }

        /* Cloudflare injects the Turnstile widget, then replaces it with its
         * "waiting for <site> to respond" text, inside #captcha-form. Both take
         * the main content width and the page font. */
        .captcha-container {
            width: 100%;
            max-width: calc(var(--content-width) / 2);
            margin: 1.75rem auto 0.25rem;
        }
        /* Flex centering keeps the widget centred even when it is wider than
         * the container: the overflow splits evenly on both sides instead of
         * spilling to the right as inline content would. */
        .captcha-container form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 0;
            text-align: center;
        }
        .captcha-container form,
        .captcha-container form * {
            font-family: var(--font) !important;
            color: var(--fg) !important;
            font-size: 1rem;
            line-height: 1.35;
        }
        .captcha-container form > * {
            flex: none;
            margin-left: auto;
            margin-right: auto;
        }
        .captcha-container form iframe {
            display: block;
            max-width: none;
        }

        footer {
            flex: none;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.25rem calc(1.25rem + env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .more-info {
            display: flex;
            flex-direction: column;
        }
        .footer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
        }
        .protection { margin: 0; white-space: nowrap; }
        .more-info a {
            color: var(--fg-muted);
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 2px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 300ms ease-in-out, text-decoration-color 300ms ease-in-out;
        }
        .more-info a:hover {
            color: var(--fg-strong);
            text-decoration-color: var(--line-hover);
        }
        .info-text {
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
            text-align: left;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 300ms ease, opacity 300ms ease, margin 300ms ease;
        }
        .info-text.open {
            max-height: 16rem;
            opacity: 1;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--line);
        }
        .info-text p { margin: 0; }
        .info-text p + p { margin-top: 0.125rem; }
        .info-text p.meta {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }
        .info-text p.meta + p:not(.meta) { margin-top: 0.5rem; }

        .reveal {
            opacity: 0.001;
            transform: translateY(12px);
            animation: reveal 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes reveal { to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .info-text, .more-info a { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page reveal">
        <svg class="mark" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M331.86-129.92q-69.37-29.92-120.68-81.21-51.31-51.29-81.25-120.63Q100-401.1 100-479.93q0-78.84 29.92-148.21t81.21-120.68q51.29-51.31 120.63-81.25Q401.1-860 479.93-860q78.84 0 148.21 29.92t120.68 81.21q51.31 51.29 81.25 120.63Q860-558.9 860-480.07q0 78.84-29.92 148.21t-81.21 120.68q-51.29 51.31-120.63 81.25Q558.9-100 480.07-100q-78.84 0-148.21-29.92ZM480-145.39q61.77 0 118.46-21.26 56.69-21.27 102.08-61.81L228.46-700.54q-39.54 46.39-61.31 102.75-21.76 56.37-21.76 117.79 0 140.07 97.27 237.34 97.27 97.27 237.34 97.27Zm250.92-114.07q38.93-45.39 61.31-102.08 22.38-56.69 22.38-118.46 0-140.07-97.27-237.34-97.27-97.27-237.34-97.27-61.55 0-118.24 21.57-56.68 21.58-102.3 62.12l471.46 471.46ZM480-480Z"/></svg>
        <h1 class="large" id="main-text"></h1>
        <p class="status" id="status-text"></p>
    </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="protection-text"></p>
                <a id="toggle-info"></a>
            </div>
            <div class="info-text" id="info-text"></div>
        </div>
    </footer>
<script>
    const readCookie = name => {
        try {
            const hit = document.cookie.split('; ').find(c => c.indexOf(name + '=') === 0);
            return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
        } catch (_) {
            return '';
        }
    };
    const cookieLang = readCookie('siteLanguage');
    const lang = cookieLang === 'zh' || cookieLang === 'en' ? cookieLang : (navigator.language.startsWith('zh') ? 'zh' : 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    const appearance = readCookie('siteAppearance');
    if (appearance === 'dark' || appearance === 'light') document.documentElement.dataset.theme = appearance;
    const texts = {
        en: {
            title: "Error • ZhehanZ Edge",
            main: "IP Blocked",
            status: "Your IP address is blocked from this service",
            show: "Show details",
            hide: "Hide details",
            protection: "ZhehanZ Edge Protection",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: IP",
                "Your connection is fine. The service denied you access based on security rules that disallow users from certain regions or IP ranges."
            ]
        },
        zh: {
            title: "错误 • ZhehanZ Edge",
            main: "IP 地址被阻止",
            status: "您的 IP 地址无法访问本服务",
            show: "查看更多信息",
            hide: "隐藏更多信息",
            protection: "ZhehanZ Edge 守护服务",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: IP",
                "您的网络连接正常。基于安全规则，此服务仅限来自特定地区或 IP 范围的用户访问，因此您的请求被拒绝。"
            ]
        }
    };

    function applyDetails(toggle, info, details, showLabel, hideLabel) {
        toggle.textContent = showLabel;
        toggle.setAttribute('role', 'button');
        toggle.setAttribute('tabindex', '0');
        toggle.setAttribute('aria-expanded', 'false');
        const render = () => {
            const isOpen = info.classList.toggle('open');
            toggle.textContent = isOpen ? hideLabel : showLabel;
            toggle.setAttribute('aria-expanded', String(isOpen));
            if (isOpen) {
                info.innerHTML = details.map((line, i) => '<p' + (i < 2 ? ' class="meta"' : '') + '>' + line + '</p>').join('');
            }
        };
        toggle.addEventListener('click', render);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(); } });
    }
    const t = texts[lang];
    document.title = t.title;
    document.getElementById('main-text').textContent = t.main;
    document.getElementById('status-text').textContent = t.status;
    document.getElementById('protection-text').textContent = t.protection;
    applyDetails(
        document.getElementById('toggle-info'),
        document.getElementById('info-text'),
        t.details,
        t.show,
        t.hide
    );
</script>
</body>
</html>
