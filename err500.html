<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Error • ZhehanZ Edge</title>
    <link rel="icon" type="image/png" sizes="72x72" href="https://pages.edge.zheha.nz/favicon.png" />
    <link rel="apple-touch-icon" href="https://pages.edge.zheha.nz/favicon.png" />
    
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f4;
            --fg-strong: #000;
            --fg: rgba(0, 0, 0, 0.5);
            --fg-muted: rgba(0, 0, 0, 0.3);
            --line: rgba(0, 0, 0, 0.15);
            --line-hover: rgba(0, 0, 0, 0.25);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            --content-width: 30rem;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1c1917;
                --fg-strong: #fff;
                --fg: rgba(255, 255, 255, 0.75);
                --fg-muted: rgba(255, 255, 255, 0.3);
                --line: rgba(255, 255, 255, 0.2);
                --line-hover: rgba(255, 255, 255, 0.3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1c1917;
            --fg-strong: #fff;
            --fg: rgba(255, 255, 255, 0.75);
            --fg-muted: rgba(255, 255, 255, 0.3);
            --line: rgba(255, 255, 255, 0.2);
            --line-hover: rgba(255, 255, 255, 0.3);
        }
        :root[data-theme="light"] { color-scheme: light; }

        * { box-sizing: border-box; }
        html {
            background: var(--bg);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }
        .hidden { display: none !important; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 0;
            padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .mark {
            width: 64px;
            height: 64px;
            fill: currentColor;
            color: var(--fg);
            margin-bottom: 1.125rem;
        }
        .large {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .status {
            margin: 0.375rem 0 0;
            max-width: var(--content-width);
            font-size: 1rem;
            line-height: 1.35;
            color: var(--fg);
            text-wrap: balance;
        }

        /* Cloudflare injects the Turnstile widget, then replaces it with its
         * "waiting for <site> to respond" text, inside #captcha-form. Both take
         * the main content width and the page font. */
        .captcha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: var(--content-width);
            margin: 1.75rem auto 0.25rem;
        }
        /* The challenge form is a fixed 300 x 65 slot, the Turnstile widget's
         * size, laid out before anything is injected. Whatever Cloudflare plugs
         * in (the widget, then its "waiting for <site> to respond" text) sits
         * centred inside it, so no other element ever moves. The text takes the
         * footer's small muted style and is limited to the slot's width. */
        .captcha-container form {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 300px;
            max-width: 100%;
            height: 65px;
            margin: 0;
            padding: 0;
            border: 0;
            text-align: center;
        }
        .captcha-container form,
        .captcha-container form * {
            font-family: var(--font) !important;
            color: var(--fg-muted) !important;
            font-size: 0.75rem;
            line-height: 1.25rem;
            vertical-align: top; /* no descender gap under Cloudflare's inline-block wrapper */
        }
        .captcha-container form > * {
            flex: none;
            width: max-content;
            max-width: 100%;
            margin: 0;
        }
        .captcha-container form iframe {
            display: block;
        }

        footer {
            flex: none;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.25rem calc(1.25rem + env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .more-info {
            display: flex;
            flex-direction: column;
        }
        .footer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
        }
        .protection { margin: 0; white-space: nowrap; }
        .more-info a {
            color: var(--fg-muted);
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 2px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 300ms ease-in-out, text-decoration-color 300ms ease-in-out;
        }
        .more-info a:hover {
            color: var(--fg-strong);
            text-decoration-color: var(--line-hover);
        }
        .info-text {
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
            text-align: left;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 300ms ease, opacity 300ms ease, margin 300ms ease;
        }
        .info-text.open {
            max-height: 16rem;
            opacity: 1;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--line);
        }
        .info-text p { margin: 0; }
        .info-text p + p { margin-top: 0.125rem; }
        .info-text p.meta {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }
        .info-text p.meta + p:not(.meta) { margin-top: 0.5rem; }

        .reveal {
            opacity: 0.001;
            transform: translateY(12px);
            animation: reveal 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes reveal { to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .info-text, .more-info a { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page reveal">
        <svg class="mark" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M251.08-187.92q-80.69 0-135.89-54.58Q60-297.08 60-377.77q0-77.31 50.5-128.23Q161-556.92 232-563.92q1.23-15.54 7.66-37.85Q246.08-624.08 256-640L111.39-784.62q-6.7-6.69-6.89-15.8-.19-9.12 6.89-16.19 7.07-7.08 16-7.08 8.92 0 16 7.08l697.38 697.38q6.69 6.69 6.88 15.81.2 9.11-6.96 16.27-7 7-16.2 6.8-9.21-.19-16.34-7.27l-100.53-100.3H251.08Zm0-45.39h412L292.31-604.08q-11.77 16.93-16.81 39.58-5.04 22.65-5.04 44.5h-19.38q-60.85 0-103.27 39.88-42.42 39.89-42.42 100.49 0 60.6 42.42 103.46 42.42 42.86 103.27 42.86Zm225.61-186.38Zm366.16 201.53-35.47-35.46q22.31-16.61 34.77-36.72 12.46-20.12 12.46-47.43 0-42.51-30.55-72.68-30.55-30.17-72.91-30.17h-65.46v-81q0-86.46-60.2-145.76-60.21-59.31-146.61-59.31-28.11 0-58.69 8.42-30.57 8.42-56.42 26.89l-31.61-32.39q36-25.92 71.73-37.11 35.73-11.2 74.49-11.2 104.57 0 178.63 73.95 74.07 73.95 74.07 178.13v35.23h12.3q65.47-1.38 111.04 40.58Q900-402.23 900-337.77q0 30.38-13.62 63.69-13.61 33.31-43.53 55.92ZM586.08-472.31Z"/></svg>
        <h1 class="large" id="main-text"></h1>
        <p class="status" id="status-text"></p>
    </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="protection-text"></p>
                <a id="toggle-info"></a>
            </div>
            <div class="info-text" id="info-text"></div>
            <div id="cf-error-box" style="display:none;">::CLOUDFLARE_ERROR_500S_BOX::</div>
        </div>
    </footer>
<script>
    const readCookie = name => {
        try {
            const hit = document.cookie.split('; ').find(c => c.indexOf(name + '=') === 0);
            return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
        } catch (_) {
            return '';
        }
    };
    const cookieLang = readCookie('siteLanguage');
    const lang = cookieLang === 'zh' || cookieLang === 'en' ? cookieLang : (navigator.language.startsWith('zh') ? 'zh' : 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    const appearance = readCookie('siteAppearance');
    if (appearance === 'dark' || appearance === 'light') document.documentElement.dataset.theme = appearance;

    // Pin the page title. Cloudflare's challenge script (and anything else that
    // loads later) is not allowed to change it, e.g. to "Just a moment...".
    function lockTitle(value) {
        const head = document.head;
        let titleEl = head.querySelector('title');
        if (!titleEl) titleEl = head.appendChild(document.createElement('title'));
        const enforce = () => {
            head.querySelectorAll('title').forEach(el => { if (el !== titleEl) el.remove(); });
            if (titleEl.textContent !== value) titleEl.textContent = value;
        };
        enforce();
        // DOM observers only: no native property is overridden, so the challenge
        // script sees an untouched browser and its own title writes are reverted.
        new MutationObserver(enforce).observe(titleEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(enforce).observe(head, { childList: true });
    }
    const texts = {
        en: {
            title: "Error • ZhehanZ Edge",
            main: "Service Unavailable",
            status: "You are connected, but the server is not responding properly",
            show: "Show details",
            hide: "Hide details",
            protection: "ZhehanZ Edge Protection",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: 500",
                "Your connection is fine. The service is either down for maintenance, or the edge network cannot get a proper response from the origin server. This usually resolves itself within minutes."
            ],
            sep: " ",
            action: "Wait a minute and reload the page. If it keeps happening, the site owner has most likely already been alerted and is working on it.",
            byStatus: {
                500: {
                    status: "The server ran into an internal error",
                    detail: "Your connection is fine. The origin server hit an unexpected error while handling this request, so there was nothing to send back."
                },
                502: {
                    status: "The server sent back an invalid response",
                    detail: "Your connection is fine. The origin server answered, but its response could not be understood. It may be restarting, overloaded or misconfigured."
                },
                503: {
                    status: "The server is temporarily unable to handle requests",
                    detail: "Your connection is fine. The origin server is deliberately refusing requests for now, usually because of maintenance or heavy load."
                },
                504: {
                    status: "The server took too long to respond",
                    detail: "Your connection is fine. The origin server accepted the request but did not finish answering in time."
                },
                520: {
                    status: "The server returned an unexpected response",
                    detail: "Your connection is fine. The origin server sent back something empty, malformed or otherwise unexpected, so it could not be passed on to you."
                },
                521: {
                    status: "The server is refusing connections",
                    detail: "Your connection is fine. The origin server is not accepting connections from the edge network; it is probably switched off or blocking edge traffic."
                },
                522: {
                    status: "The connection to the server timed out",
                    detail: "Your connection is fine. The edge network could not establish a connection to the origin server in time. The server may be down or overloaded."
                },
                523: {
                    status: "The server cannot be reached",
                    detail: "Your connection is fine. The edge network has no route to the origin server. Its address may have changed, or its network is down."
                },
                524: {
                    status: "The server did not finish responding in time",
                    detail: "Your connection is fine. A connection was made, but the origin server took too long to complete its response. It is probably busy with a slow request."
                },
                525: {
                    status: "The secure connection to the server failed",
                    detail: "Your connection is fine. The TLS handshake between the edge network and the origin server failed, which points to a certificate or configuration problem on the server."
                },
                526: {
                    status: "The server presented an invalid certificate",
                    detail: "Your connection is fine. The origin server offered a TLS certificate that could not be trusted, so the secure connection was refused."
                },
                530: {
                    status: "The server address could not be resolved",
                    detail: "Your connection is fine. The edge network could not look up where the origin server lives, which means a DNS or tunnel misconfiguration on the site."
                }
            }
        },
        zh: {
            title: "错误 • ZhehanZ Edge",
            main: "服务暂不可用",
            status: "您已连接，但服务器未能正常响应",
            show: "查看更多信息",
            hide: "隐藏更多信息",
            protection: "ZhehanZ Edge 守护服务",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: 500",
                "您的网络连接正常。此服务可能正在停机维护，或边缘网络无法从源服务器获得正常响应。该问题通常会在几分钟内自行恢复。"
            ],
            sep: "",
            action: "请稍候一分钟后刷新页面。如果问题持续出现，站点所有者通常已收到通知并正在处理。",
            byStatus: {
                500: {
                    status: "服务器发生内部错误",
                    detail: "您的网络连接正常。源服务器在处理此请求时发生了意外错误，因此没有内容可以返回。"
                },
                502: {
                    status: "服务器返回了无效的响应",
                    detail: "您的网络连接正常。源服务器有响应，但内容无法被识别，可能正在重启、负载过高或配置有误。"
                },
                503: {
                    status: "服务器暂时无法处理请求",
                    detail: "您的网络连接正常。源服务器目前主动拒绝请求，通常是由于维护或负载过高。"
                },
                504: {
                    status: "服务器响应超时",
                    detail: "您的网络连接正常。源服务器接受了请求，但未能及时完成响应。"
                },
                520: {
                    status: "服务器返回了意外的响应",
                    detail: "您的网络连接正常。源服务器返回了空白、格式错误或其他意外的内容，无法转交给您。"
                },
                521: {
                    status: "服务器拒绝连接",
                    detail: "您的网络连接正常。源服务器不接受来自边缘网络的连接，可能已关闭或屏蔽了边缘流量。"
                },
                522: {
                    status: "与服务器的连接超时",
                    detail: "您的网络连接正常。边缘网络未能及时与源服务器建立连接，服务器可能已关闭或负载过高。"
                },
                523: {
                    status: "无法访问服务器",
                    detail: "您的网络连接正常。边缘网络找不到通往源服务器的路由，其地址可能已更改，或其网络已中断。"
                },
                524: {
                    status: "服务器未能及时完成响应",
                    detail: "您的网络连接正常。连接已建立，但源服务器花费了过长时间仍未完成响应，可能正被缓慢的请求占用。"
                },
                525: {
                    status: "与服务器的安全连接失败",
                    detail: "您的网络连接正常。边缘网络与源服务器之间的 TLS 握手失败，通常表示服务器的证书或配置存在问题。"
                },
                526: {
                    status: "服务器提供的证书无效",
                    detail: "您的网络连接正常。源服务器提供的 TLS 证书不受信任，因此安全连接被拒绝。"
                },
                530: {
                    status: "无法解析服务器地址",
                    detail: "您的网络连接正常。边缘网络无法查询到源服务器的位置，说明站点的 DNS 或隧道配置有误。"
                }
            }
        }
    };

    function applyDetails(toggle, info, details, showLabel, hideLabel) {
        toggle.textContent = showLabel;
        toggle.setAttribute('role', 'button');
        toggle.setAttribute('tabindex', '0');
        toggle.setAttribute('aria-expanded', 'false');
        const render = () => {
            const isOpen = info.classList.toggle('open');
            toggle.textContent = isOpen ? hideLabel : showLabel;
            toggle.setAttribute('aria-expanded', String(isOpen));
            if (isOpen) {
                info.innerHTML = details.map((line, i) => '<p' + (i < 2 ? ' class="meta"' : '') + '>' + line + '</p>').join('');
            }
        };
        toggle.addEventListener('click', render);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(); } });
    }
    const t = texts[lang];

    function responseStatus() {
        try {
            const nav = performance.getEntriesByType('navigation')[0];
            const code = nav && nav.responseStatus;
            return typeof code === 'number' && code > 0 ? code : null;
        } catch (_) {
            return null;
        }
    }
    // Specific wording per HTTP status; anything unlisted keeps the stock text.
    const code = responseStatus();
    const specific = code !== null && t.byStatus[code] ? t.byStatus[code] : null;
    if (specific) {
        t.status = specific.status;
        t.details = [t.details[0], t.details[1].replace(/\d+$/, String(code)), specific.detail + t.sep + t.action];
    } else {
        t.details = [t.details[0], t.details[1], t.details[2] + t.sep + t.action];
    }
    lockTitle(t.title);
    document.getElementById('main-text').textContent = t.main;
    document.getElementById('status-text').textContent = t.status;
    document.getElementById('protection-text').textContent = t.protection;
    applyDetails(
        document.getElementById('toggle-info'),
        document.getElementById('info-text'),
        t.details,
        t.show,
        t.hide
    );
</script>
</body>
</html>
