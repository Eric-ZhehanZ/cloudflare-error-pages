<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Error • ZhehanZ Edge</title>
    <link rel="icon" type="image/png" sizes="72x72" href="https://pages.edge.zheha.nz/favicon.png" />
    <link rel="apple-touch-icon" href="https://pages.edge.zheha.nz/favicon.png" />
    
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f4;
            --fg-strong: #000;
            --fg: rgba(0, 0, 0, 0.5);
            --fg-muted: rgba(0, 0, 0, 0.3);
            --line: rgba(0, 0, 0, 0.15);
            --line-hover: rgba(0, 0, 0, 0.25);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            --content-width: 30rem;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1c1917;
                --fg-strong: #fff;
                --fg: rgba(255, 255, 255, 0.75);
                --fg-muted: rgba(255, 255, 255, 0.3);
                --line: rgba(255, 255, 255, 0.2);
                --line-hover: rgba(255, 255, 255, 0.3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1c1917;
            --fg-strong: #fff;
            --fg: rgba(255, 255, 255, 0.75);
            --fg-muted: rgba(255, 255, 255, 0.3);
            --line: rgba(255, 255, 255, 0.2);
            --line-hover: rgba(255, 255, 255, 0.3);
        }
        :root[data-theme="light"] { color-scheme: light; }

        * { box-sizing: border-box; }
        html {
            background: var(--bg);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }
        .hidden { display: none !important; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 0;
            padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .mark {
            width: 64px;
            height: 64px;
            fill: currentColor;
            color: var(--fg);
            margin-bottom: 1.125rem;
        }
        .large {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .status {
            margin: 0.375rem 0 0;
            max-width: var(--content-width);
            font-size: 1rem;
            line-height: 1.35;
            color: var(--fg);
            text-wrap: balance;
        }

        /* Cloudflare injects the Turnstile widget, then replaces it with its
         * "waiting for <site> to respond" text, inside #captcha-form. Both take
         * the main content width and the page font. */
        .captcha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: var(--content-width);
            margin: 1.75rem auto 0.25rem;
        }
        /* The challenge form is a fixed 300 x 65 slot, the Turnstile widget's
         * size, laid out before anything is injected. Whatever Cloudflare plugs
         * in (the widget, then its "waiting for <site> to respond" text) sits
         * centred inside it, so no other element ever moves. The text takes the
         * footer's small muted style and is limited to the slot's width. */
        .captcha-container form {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 300px;
            max-width: 100%;
            height: 65px;
            margin: 0;
            padding: 0;
            border: 0;
            text-align: center;
        }
        .captcha-container form,
        .captcha-container form * {
            font-family: var(--font) !important;
            color: var(--fg-muted) !important;
            font-size: 0.75rem;
            line-height: 1.25rem;
            vertical-align: top; /* no descender gap under Cloudflare's inline-block wrapper */
        }
        .captcha-container form > * {
            flex: none;
            width: max-content;
            max-width: 100%;
            margin: 0;
        }
        .captcha-container form iframe {
            display: block;
        }

        footer {
            flex: none;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.25rem calc(1.25rem + env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .more-info {
            display: flex;
            flex-direction: column;
        }
        .footer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
        }
        .protection { margin: 0; white-space: nowrap; }
        .more-info a {
            color: var(--fg-muted);
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 2px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 300ms ease-in-out, text-decoration-color 300ms ease-in-out;
        }
        .more-info a:hover {
            color: var(--fg-strong);
            text-decoration-color: var(--line-hover);
        }
        .info-text {
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
            text-align: left;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 300ms ease, opacity 300ms ease, margin 300ms ease;
        }
        .info-text.open {
            max-height: 16rem;
            opacity: 1;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--line);
        }
        .info-text p { margin: 0; }
        .info-text p + p { margin-top: 0.125rem; }
        .info-text p.meta {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }
        .info-text p.meta + p:not(.meta) { margin-top: 0.5rem; }

        .reveal {
            opacity: 0.001;
            transform: translateY(12px);
            animation: reveal 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes reveal { to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .info-text, .more-info a { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page reveal">
        <svg class="mark" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M290.37-695.46q-17.83 0-30.22 12.48-12.38 12.48-12.38 30.31 0 17.82 12.48 30.21 12.48 12.38 30.31 12.38 17.82 0 30.21-12.48 12.38-12.48 12.38-30.3 0-17.83-12.48-30.22-12.48-12.38-30.3-12.38Zm0 385.54q-17.83 0-30.22 12.48-12.38 12.48-12.38 30.3 0 17.83 12.48 30.22 12.48 12.38 30.31 12.38 17.82 0 30.21-12.48 12.38-12.48 12.38-30.31 0-17.82-12.48-30.21-12.48-12.38-30.3-12.38ZM170.92-807.07h617.61q13.97 0 22.72 8.72 8.75 8.72 8.75 23.42v238.39q0 17.04-8.75 27.87-8.75 10.82-22.72 10.82H170.92q-13.42 0-22.17-10.82Q140-519.5 140-536.54v-238.39q0-14.7 8.75-23.42 8.75-8.72 22.17-8.72Zm14.47 45.38v218.46h589.22v-218.46H185.39Zm-14.47 339.54h613.54q14.23 0 24.88 11.5Q820-399.14 820-384.59v233.2q0 18.85-10.66 28.96-10.65 10.12-24.88 10.12H175.54q-15.23 0-25.38-10.12Q140-132.54 140-151.39v-233.2q0-14.55 8.35-26.06 8.34-11.5 22.57-11.5Zm14.47 45.38v219.08h589.22v-219.08H185.39Zm0-384.92v218.46-218.46Zm0 384.92v219.08-219.08Z"/></svg>
        <h1 class="large" id="main-text"></h1>
        <p class="status" id="status-text"></p>
    </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="protection-text"></p>
                <a id="toggle-info"></a>
            </div>
            <div class="info-text" id="info-text"></div>
            <div id="cf-error-box" style="display:none;">::CLOUDFLARE_ERROR_1000S_BOX::</div>
        </div>
    </footer>
<script>
    const readCookie = name => {
        try {
            const hit = document.cookie.split('; ').find(c => c.indexOf(name + '=') === 0);
            return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
        } catch (_) {
            return '';
        }
    };
    const cookieLang = readCookie('siteLanguage');
    const lang = cookieLang === 'zh' || cookieLang === 'en' ? cookieLang : (navigator.language.startsWith('zh') ? 'zh' : 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    const appearance = readCookie('siteAppearance');
    if (appearance === 'dark' || appearance === 'light') document.documentElement.dataset.theme = appearance;

    // Pin the page title. Cloudflare's challenge script (and anything else that
    // loads later) is not allowed to change it, e.g. to "Just a moment...".
    function lockTitle(value) {
        const head = document.head;
        let titleEl = head.querySelector('title');
        if (!titleEl) titleEl = head.appendChild(document.createElement('title'));
        const enforce = () => {
            head.querySelectorAll('title').forEach(el => { if (el !== titleEl) el.remove(); });
            if (titleEl.textContent !== value) titleEl.textContent = value;
        };
        enforce();
        // DOM observers only: no native property is overridden, so the challenge
        // script sees an untouched browser and its own title writes are reverted.
        new MutationObserver(enforce).observe(titleEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(enforce).observe(head, { childList: true });
    }
    const texts = {
        en: {
            title: "Error • ZhehanZ Edge",
            main: "Service Unavailable",
            status: "You are connected, but the site cannot be served right now",
            show: "Show details",
            hide: "Hide details",
            protection: "ZhehanZ Edge Protection",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: 1000",
                "Your connection is fine. The site is either down for maintenance, or a configuration problem on the site is stopping the edge network from serving it. This usually resolves itself soon."
            ],
            sep: " ",
            action: "Reload the page in a minute. If it keeps happening, we need to correct the configuration; quote the ID above when reporting it.",
            byStatus: {
                403: {
                    status: "Access to this site is denied by its configuration",
                    detail: "Your connection is fine. A rule on the site turned this request away, most often a blocked address, direct access by IP instead of the domain name, or a firewall rule."
                },
                409: {
                    status: "The requested hostname does not match the site",
                    detail: "Your connection is fine. The name you asked for does not line up with how the site is configured, for example a mismatch between the address and its certificate, or a DNS record that cannot be resolved."
                },
                429: {
                    status: "Too many requests were sent in a short time",
                    detail: "Your connection is fine. The site limits how many requests one address may make within a short period. The limit lifts automatically after a short wait."
                },
                500: {
                    status: "A script serving this site failed",
                    detail: "Your connection is fine. Code that runs on the edge for this site threw an error or exceeded its limits before it could produce a page."
                },
                502: {
                    status: "The site points to an address it cannot use",
                    detail: "Your connection is fine. The site’s DNS is set to an address that the edge network is not allowed to serve, which we need to correct."
                },
                530: {
                    status: "The server address could not be resolved",
                    detail: "Your connection is fine. The edge network could not find the origin server because its DNS record does not resolve or its tunnel is not connected."
                }
            }
        },
        zh: {
            title: "错误 • ZhehanZ Edge",
            main: "服务暂不可用",
            status: "您已连接，但站点目前无法提供服务",
            show: "查看更多信息",
            hide: "隐藏更多信息",
            protection: "ZhehanZ Edge 守护服务",
            details: [
                "::RAY_ID::",
                "::CLIENT_IP:: ::GEO:: 1000",
                "您的网络连接正常。此站点可能正在停机维护，或站点的配置问题导致边缘网络无法提供服务。该问题通常会很快自行恢复。"
            ],
            sep: "",
            action: "请稍候一分钟后刷新页面。如果问题持续出现，需要我们修正配置；反馈时请附上上方的 ID。",
            byStatus: {
                403: {
                    status: "站点的配置拒绝了此次访问",
                    detail: "您的网络连接正常。站点上的某条规则拒绝了此请求，常见原因是地址被屏蔽、使用 IP 而非域名直接访问，或触发了防火墙规则。"
                },
                409: {
                    status: "请求的主机名与站点不匹配",
                    detail: "您的网络连接正常。您请求的名称与站点的配置不一致，例如地址与证书不匹配，或 DNS 记录无法解析。"
                },
                429: {
                    status: "短时间内发送了过多请求",
                    detail: "您的网络连接正常。站点限制了单个地址在短时间内的请求次数，稍候片刻后限制会自动解除。"
                },
                500: {
                    status: "为站点提供服务的脚本出错",
                    detail: "您的网络连接正常。在边缘网络上为此站点运行的代码抛出了错误或超出了资源限制，未能生成页面。"
                },
                502: {
                    status: "站点指向了一个无法使用的地址",
                    detail: "您的网络连接正常。站点的 DNS 指向了边缘网络不允许提供服务的地址，需要我们修正。"
                },
                530: {
                    status: "无法解析服务器地址",
                    detail: "您的网络连接正常。边缘网络找不到源服务器，其 DNS 记录无法解析，或其隧道未连接。"
                }
            }
        }
    };

    function applyDetails(toggle, info, details, showLabel, hideLabel) {
        toggle.textContent = showLabel;
        toggle.setAttribute('role', 'button');
        toggle.setAttribute('tabindex', '0');
        toggle.setAttribute('aria-expanded', 'false');
        const render = () => {
            const isOpen = info.classList.toggle('open');
            toggle.textContent = isOpen ? hideLabel : showLabel;
            toggle.setAttribute('aria-expanded', String(isOpen));
            if (isOpen) {
                info.innerHTML = details.map((line, i) => '<p' + (i < 2 ? ' class="meta"' : '') + '>' + line + '</p>').join('');
            }
        };
        toggle.addEventListener('click', render);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(); } });
    }
    const t = texts[lang];

    function responseStatus() {
        try {
            const nav = performance.getEntriesByType('navigation')[0];
            const code = nav && nav.responseStatus;
            return typeof code === 'number' && code > 0 ? code : null;
        } catch (_) {
            return null;
        }
    }
    // Specific wording per HTTP status; anything unlisted keeps the stock text.
    const code = responseStatus();
    const specific = code !== null && t.byStatus[code] ? t.byStatus[code] : null;
    if (specific) {
        t.status = specific.status;
        t.details = [t.details[0], t.details[1].replace(/\d+$/, String(code)), specific.detail + t.sep + t.action];
    } else {
        t.details = [t.details[0], t.details[1], t.details[2] + t.sep + t.action];
    }
    lockTitle(t.title);
    document.getElementById('main-text').textContent = t.main;
    document.getElementById('status-text').textContent = t.status;
    document.getElementById('protection-text').textContent = t.protection;
    applyDetails(
        document.getElementById('toggle-info'),
        document.getElementById('info-text'),
        t.details,
        t.show,
        t.hide
    );
</script>
</body>
</html>
