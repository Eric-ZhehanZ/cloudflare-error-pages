<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Validation • ZhehanZ Edge</title>
    <link rel="icon" type="image/png" sizes="72x72" href="https://pages.edge.zheha.nz/favicon.png" />
    <link rel="apple-touch-icon" href="https://pages.edge.zheha.nz/favicon.png" />
    
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f4;
            --fg-strong: #000;
            --fg: rgba(0, 0, 0, 0.5);
            --fg-muted: rgba(0, 0, 0, 0.3);
            --line: rgba(0, 0, 0, 0.15);
            --line-hover: rgba(0, 0, 0, 0.25);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            --content-width: 30rem;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1c1917;
                --fg-strong: #fff;
                --fg: rgba(255, 255, 255, 0.75);
                --fg-muted: rgba(255, 255, 255, 0.3);
                --line: rgba(255, 255, 255, 0.2);
                --line-hover: rgba(255, 255, 255, 0.3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1c1917;
            --fg-strong: #fff;
            --fg: rgba(255, 255, 255, 0.75);
            --fg-muted: rgba(255, 255, 255, 0.3);
            --line: rgba(255, 255, 255, 0.2);
            --line-hover: rgba(255, 255, 255, 0.3);
        }
        :root[data-theme="light"] { color-scheme: light; }

        * { box-sizing: border-box; }
        html {
            background: var(--bg);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }
        .hidden { display: none !important; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 0;
            padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .mark {
            width: 64px;
            height: 64px;
            fill: currentColor;
            color: var(--fg);
            margin-bottom: 1.125rem;
        }
        .large {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .status {
            margin: 0.375rem 0 0;
            max-width: var(--content-width);
            font-size: 1rem;
            line-height: 1.35;
            color: var(--fg);
            text-wrap: balance;
        }

        /* Cloudflare injects the Turnstile widget, then replaces it with its
         * "waiting for <site> to respond" text, inside #captcha-form. Both take
         * the main content width and the page font. */
        .captcha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: calc(var(--content-width) / 2);
            margin: 1.75rem auto 0.25rem;
        }
        /* Flex centering keeps the widget centred even when it is wider than
         * the container: the overflow splits evenly on both sides instead of
         * spilling to the right as inline content would. */
        .captcha-container form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 65px; /* widget height, reserved before it loads */
            margin: 0;
            text-align: center;
        }
        .captcha-container form,
        .captcha-container form * {
            font-family: var(--font) !important;
            color: var(--fg) !important;
            font-size: 1rem;
            line-height: 1.35;
        }
        .captcha-container form > * {
            flex: none;
            width: max-content;
            max-width: none;
            margin: 0;
        }
        .captcha-container form iframe {
            display: block;
            max-width: none;
        }
        /* Once Cloudflare swaps the widget for its "waiting for <site> to
         * respond" text, the form becomes a box of the widget's exact size
         * (300 x 65) so the text sits where the widget was. */
        .captcha-container form.boxed {
            flex: none;
            width: 300px;
            max-width: none;
            height: 65px;
            justify-content: center;
            padding: 0 1rem;
            border: 1px solid var(--line);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .captcha-container form.boxed,
        .captcha-container form.boxed * {
            font-size: 0.9375rem;
            line-height: 1.3;
        }
        .captcha-container form.boxed > * {
            width: auto;
            max-width: 100%;
        }

        footer {
            flex: none;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.25rem calc(1.25rem + env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
        }
        .more-info {
            display: flex;
            flex-direction: column;
        }
        .footer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
        }
        .protection { margin: 0; white-space: nowrap; }
        .more-info a {
            color: var(--fg-muted);
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 2px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 300ms ease-in-out, text-decoration-color 300ms ease-in-out;
        }
        .more-info a:hover {
            color: var(--fg-strong);
            text-decoration-color: var(--line-hover);
        }
        .info-text {
            font-size: 0.75rem;
            line-height: 1.25rem;
            color: var(--fg-muted);
            text-align: left;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 300ms ease, opacity 300ms ease, margin 300ms ease;
        }
        .info-text.open {
            max-height: 16rem;
            opacity: 1;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--line);
        }
        .info-text p { margin: 0; }
        .info-text p + p { margin-top: 0.125rem; }
        .info-text p.meta {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }
        .info-text p.meta + p:not(.meta) { margin-top: 0.5rem; }

        .reveal {
            opacity: 0.001;
            transform: translateY(12px);
            animation: reveal 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes reveal { to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .info-text, .more-info a { transition: none; }
        }
        .spinner {
            animation: spin 1.1s linear infinite;
            transform-origin: 50% 50%;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2.4s; }
        }
        .cloudflare-box { display: none !important; }
        section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <section id="captcha-view" class="hidden">
        <main class="page reveal">
            <svg class="mark" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m438.62-423.38-80.54-80.54q-6.31-6.69-16.23-6.89-9.93-.19-17 6.89-7.08 6.69-7.08 16.25 0 9.57 7.08 16.98l91.69 91.92q8.61 9 20.04 9 11.42 0 20.04-9l177.53-177.15q6.7-6.76 6.89-16.34.19-9.59-6.39-15.66-6.57-6.08-16.3-5.77-9.73.31-15.81 6.38L438.62-423.38Zm31.31 317.22q-4.75-1-9.31-3-129.77-46.23-205.2-160.99Q180-384.92 180-521.18v-185.13q0-18.48 10.49-33.51 10.49-15.02 26.97-21.56l242.31-90.08q10.61-4 20.23-4 9.62 0 20.23 4l242.31 90.08q16.48 6.54 26.97 21.56Q780-724.79 780-706.31v185.13q0 136.26-75.42 251.03-75.43 114.76-205.2 160.99-4.56 2-9.31 3-4.75 1-10.07 1t-10.07-1ZM480-148.77Q591.92-185.23 663.27-289q71.34-103.77 71.34-232.08v-185.61q0-3.85-2.11-6.92-2.12-3.08-5.96-4.62l-242.31-91.08q-1.92-.77-4.23-.77-2.31 0-4.23.77l-242.31 91.08q-3.84 1.54-5.96 4.62-2.11 3.07-2.11 6.92v185.61q0 128.31 71.34 232.08Q368.08-185.23 480-148.77Zm0-330.46Z"/></svg>
            <h1 class="large" id="captcha-main-text"></h1>
            <p class="status" id="captcha-status-text"></p>
            <div class="captcha-container">
                <form id="captcha-form">::CAPTCHA_BOX::</form>
            </div>
        </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="captcha-protection-text"></p>
                <a id="captcha-toggle-info"></a>
            </div>
            <div class="info-text" id="captcha-info-text"></div>
        </div>
    </footer>
    </section>

    <section id="attack-view" class="hidden">
        <main class="page reveal">
            <svg class="mark spinner" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M331.32-129.4q-69.29-29.4-120.9-81.02-51.62-51.61-81.02-120.9-29.4-69.3-29.4-148.73 0-79.43 29.46-148.73 29.46-69.3 80.96-120.8 51.5-51.5 120.93-80.96Q400.78-860 480-860q9.29 0 15.99 6.71 6.7 6.7 6.7 16 0 9.29-6.7 15.98-6.7 6.7-15.99 6.7-138.69 0-236.65 97.96-97.96 97.96-97.96 236.65t97.96 236.65q97.96 97.96 236.65 97.96t236.65-97.96q97.96-97.96 97.96-236.65 0-9.31 6.71-16 6.71-6.69 16-6.69t15.99 6.7Q860-489.29 860-480q0 79.22-29.46 148.65t-80.96 120.93q-51.5 51.5-120.8 80.96Q559.48-100 480.05-100q-79.43 0-148.73-29.4Z"/></svg>
            <h1 class="large" id="attack-main-text"></h1>
            <p class="status" id="attack-status-text"></p>
            <div class="cloudflare-box" id="attack-box-shell">::IM_UNDER_ATTACK_BOX::</div>
        </main>
    <footer class="reveal">
        <div class="more-info">
            <div class="footer-row">
                <p class="protection" id="attack-protection-text"></p>
                <a id="attack-toggle-info"></a>
            </div>
            <div class="info-text" id="attack-info-text"></div>
        </div>
    </footer>
    </section>

<script>
    const readCookie = name => {
        try {
            const hit = document.cookie.split('; ').find(c => c.indexOf(name + '=') === 0);
            return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
        } catch (_) {
            return '';
        }
    };
    const cookieLang = readCookie('siteLanguage');
    const lang = cookieLang === 'zh' || cookieLang === 'en' ? cookieLang : (navigator.language.startsWith('zh') ? 'zh' : 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    const appearance = readCookie('siteAppearance');
    if (appearance === 'dark' || appearance === 'light') document.documentElement.dataset.theme = appearance;

    // Pin the page title. Cloudflare's challenge script (and anything else that
    // loads later) is not allowed to change it, e.g. to "Just a moment...".
    function lockTitle(value) {
        const head = document.head;
        let titleEl = head.querySelector('title');
        if (!titleEl) titleEl = head.appendChild(document.createElement('title'));
        const enforce = () => {
            head.querySelectorAll('title').forEach(el => { if (el !== titleEl) el.remove(); });
            if (titleEl.textContent !== value) titleEl.textContent = value;
        };
        enforce();
        try {
            Object.defineProperty(document, 'title', { configurable: true, get: () => value, set: enforce });
        } catch (_) {}
        new MutationObserver(enforce).observe(titleEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(enforce).observe(head, { childList: true });
    }
    const texts = {
        en: {
            title: "Validation • ZhehanZ Edge",
            captcha: {
                main: "Validation Required",
                status: "Pass the turnstile to continue access",
                show: "Show details",
                hide: "Hide details",
                protection: "ZhehanZ Edge Protection",
                details: [
                    "::RAY_ID::",
                    "::CLIENT_IP:: ::GEO:: AUTO-INT",
                    "You need to undergo validation due to unusual traffic from your network or a strengthened security posture."
                ]
            },
            attack: {
                main: "One Moment Please",
                status1: "Checking your device and network",
                status2: "Check complete — Proceeding",
                show: "Show details",
                hide: "Hide details",
                protection: "ZhehanZ Edge Protection",
                details: [
                    "::RAY_ID::",
                    "::CLIENT_IP:: ::GEO:: AUTO-NON",
                    "You need to undergo validation due to unusual traffic from your network or a strengthened security posture."
                ]
            }
        },
        zh: {
            title: "验证 • ZhehanZ Edge",
            captcha: {
                main: "需要完成验证",
                status: "通过以下验证以继续访问",
                show: "查看更多信息",
                hide: "隐藏更多信息",
                protection: "ZhehanZ Edge 守护服务",
                details: [
                    "::RAY_ID::",
                    "::CLIENT_IP:: ::GEO:: 403 AUTO-INT",
                    "您需要完成此验证过程，可能是因为您的网络流量异常，或者目标服务的安全级别较高。"
                ]
            },
            attack: {
                main: "请等候验证",
                status1: "正在自动检查设备及网络",
                status2: "检查完成 — 即将继续访问",
                show: "查看更多信息",
                hide: "隐藏更多信息",
                protection: "ZhehanZ Edge 守护服务",
                details: [
                    "::RAY_ID::",
                    "::CLIENT_IP:: ::GEO:: 403 AUTO-NON",
                    "您需要完成此验证过程，可能是因为您的网络流量异常，或者目标服务的安全级别较高。"
                ]
            }
        }
    };

    const refreshSeconds = 12;
    const captchaView = document.getElementById('captcha-view');
    const attackView = document.getElementById('attack-view');
    const captchaShell = document.getElementById('captcha-form');
    const attackShell = document.getElementById('attack-box-shell');
    const state = {
        mode: null,
        countdownId: null,
        refreshId: null
    };

    function applyDetails(toggle, info, details, showLabel, hideLabel) {
        toggle.textContent = showLabel;
        toggle.setAttribute('role', 'button');
        toggle.setAttribute('tabindex', '0');
        toggle.setAttribute('aria-expanded', 'false');
        const render = () => {
            const isOpen = info.classList.toggle('open');
            toggle.textContent = isOpen ? hideLabel : showLabel;
            toggle.setAttribute('aria-expanded', String(isOpen));
            if (isOpen) {
                info.innerHTML = details.map((line, i) => '<p' + (i < 2 ? ' class="meta"' : '') + '>' + line + '</p>').join('');
            }
        };
        toggle.addEventListener('click', render);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(); } });
    }

    function watchChallengeBox(form) {
        // Turnstile renders its iframe inside a closed shadow root, so the widget
        // cannot be found by querying for an iframe. Its host element still lays
        // out at the widget's size, so the rendered box tells the two states apart:
        // widget showing (a child at least ~50px tall) vs Cloudflare's waiting text.
        const resize = typeof ResizeObserver === 'function' ? new ResizeObserver(() => update()) : null;
        function update() {
            const els = Array.from(form.querySelectorAll('*'));
            if (resize) els.forEach(el => resize.observe(el));
            const text = (form.innerText || form.textContent).trim();
            const hasText = text !== '' && !/^::[A-Z0-9_]+::$/.test(text);
            const showsWidget = els.some(el => {
                const r = el.getBoundingClientRect();
                return r.height >= 50 && r.width >= 150;
            });
            const boxed = hasText && !showsWidget;
            if (form.classList.contains('boxed') !== boxed) form.classList.toggle('boxed', boxed);
        }
        update();
        new MutationObserver(update).observe(form, { childList: true, subtree: true, attributes: true, characterData: true });
        window.setInterval(update, 500);
    }

    function isPlaceholderText(value) {
        return /^::[A-Z0-9_]+::$/.test(value);
    }

    function isActivated(shell) {
        if (!shell) {
            return false;
        }

        const text = shell.textContent.trim();
        const hasElementChildren = shell.querySelector('*') !== null;

        if (hasElementChildren) {
            return true;
        }

        if (!text) {
            return false;
        }

        return !isPlaceholderText(text);
    }

    function stopAttackCountdown() {
        if (state.countdownId !== null) {
            window.clearInterval(state.countdownId);
            state.countdownId = null;
        }
        if (state.refreshId !== null) {
            window.clearTimeout(state.refreshId);
            state.refreshId = null;
        }
    }

    function startAttackCountdown() {
        stopAttackCountdown();

        state.refreshId = window.setTimeout(() => {
            window.location.reload();
        }, refreshSeconds * 1000);
    }

    function setMode(mode) {
        if (state.mode === mode) {
            return;
        }

        state.mode = mode;
        captchaView.classList.toggle('hidden', mode !== 'captcha');
        attackView.classList.toggle('hidden', mode !== 'attack');

        if (mode === 'attack') {
            startAttackCountdown();
        } else {
            stopAttackCountdown();
        }
    }

    function updateMode() {
        const captchaActive = isActivated(captchaShell);
        const attackActive = isActivated(attackShell);

        if (captchaActive) {
            setMode('captcha');
            return;
        }

        if (attackActive || state.mode !== 'captcha') {
            setMode('attack');
        }
    }

    function initializeCaptcha() {
        const t = texts[lang].captcha;
        document.getElementById('captcha-main-text').textContent = t.main;
        document.getElementById('captcha-status-text').textContent = t.status;
        document.getElementById('captcha-protection-text').textContent = t.protection;
        applyDetails(
            document.getElementById('captcha-toggle-info'),
            document.getElementById('captcha-info-text'),
            t.details,
            t.show,
            t.hide
        );
    }

    function initializeAttack() {
        const t = texts[lang].attack;
        document.getElementById('attack-main-text').textContent = t.main;
        const statusEl = document.getElementById('attack-status-text');
        statusEl.textContent = t.status1;
        document.getElementById('attack-protection-text').textContent = t.protection;
        applyDetails(
            document.getElementById('attack-toggle-info'),
            document.getElementById('attack-info-text'),
            t.details,
            t.show,
            t.hide
        );

        window.setTimeout(() => {
            if (state.mode === 'attack') {
                statusEl.textContent = t.status2;
            }
        }, 5000);
    }

    function watchForPlaceholderChanges() {
        const observer = new MutationObserver(updateMode);
        observer.observe(captchaShell, { childList: true, subtree: true, characterData: true });
        observer.observe(attackShell, { childList: true, subtree: true, characterData: true });
    }

    lockTitle(texts[lang].title);
    initializeCaptcha();
    initializeAttack();
    updateMode();
    watchForPlaceholderChanges();
    watchChallengeBox(captchaShell);
</script>
</body>
</html>
